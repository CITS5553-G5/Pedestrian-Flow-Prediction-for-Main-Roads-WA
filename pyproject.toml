[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pedflow"
version = "0.1.0"
description = "Reusable workflow code for the CITS5553 pedestrian-flow project"
readme = "README.md"
requires-python = ">=3.11"

[project.scripts]
pedflow-context = "pedflow.context.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"pedflow.modeling" = ["releases/*.json"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
