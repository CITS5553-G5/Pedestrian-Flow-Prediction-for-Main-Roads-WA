name: pedestrian-exposure-wa

services:
  app:
    image: mcr.microsoft.com/devcontainers/python:1-3.11-bookworm
    container_name: pedestrian-exposure-wa-app
    volumes:
      - ..:/workspace:cached
      - frontend_node_modules:/workspace/05_application/frontend/node_modules
    working_dir: /workspace
    command: sleep infinity

volumes:
  frontend_node_modules:
    name: pedestrian-exposure-wa-frontend-node-modules
